name: Rebuild index
on:
  schedule:
    - cron: "17 6 * * *"      # nightly, 06:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node pipeline/build-index.mjs
      - name: Collect imagery (API when a key is present, page scrape otherwise)
        env:
          ROBOFLOW_API_KEY: ${{ secrets.ROBOFLOW_API_KEY }}
        run: |
          if [ -n "$ROBOFLOW_API_KEY" ]; then BATCH=15000 RATE=4 node pipeline/build-imagery-api.mjs
          else BATCH=15000 RATE=4 node pipeline/build-imagery.mjs; fi
      - run: node pipeline/build-index.mjs --from raw
      - name: Commit data
        run: |
          git config user.name "universe-orb bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data pipeline/cache/slugs.json
          git diff --cached --quiet || git commit -m "index: nightly rebuild"
          git pull --rebase origin main
          git push
